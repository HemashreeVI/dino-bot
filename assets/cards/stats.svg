<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="stats-t stats-d">
<title id="stats-t">Results</title>
<desc id="stats-d">7,899 points in 7 min, 0 crashes; 13.0 top game speed reached; 200/s decisions per second; 44 lines of JavaScript</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="stats-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#13204A"/>
    <stop offset=".55" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#060914"/>
  </radialGradient>
  <radialGradient id="stats-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4169E1" stop-opacity=".38"/>
    <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="stats-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F5B461" stop-opacity=".10"/>
    <stop offset="1" stop-color="#F5B461" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="stats-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C4CCE8"/>
    <stop offset="1" stop-color="#8EA8FF"/>
  </linearGradient>
  <linearGradient id="stats-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8EA8FF" stop-opacity="0"/>
    <stop offset=".25" stop-color="#8EA8FF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8EA8FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="stats-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#8EA8FF" stroke-opacity=".05"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1198" height="148" rx="22" fill="url(#stats-bg)" stroke="#1B2754"/>
<rect x="1" y="1" width="1198" height="148" rx="22" fill="url(#stats-grid)"/>
<ellipse cx="600" cy="75" rx="420" ry="105" fill="url(#stats-glowA)"/>
<ellipse cx="600" cy="75" rx="300" ry="75" fill="url(#stats-glowB)"/><rect x="36" y="24" width="276" height="102" rx="16" fill="#0D1630" stroke="#2B3D7C"/><text x="174" y="78" class="serif" font-size="38" fill="url(#stats-silver)" text-anchor="middle" >7,899</text><text x="174" y="104" class="sans" font-size="13" fill="#8D97BF" text-anchor="middle" >points in 7 min, 0 crashes</text><rect x="320" y="24" width="276" height="102" rx="16" fill="#0D1630" stroke="#2B3D7C"/><text x="458" y="78" class="serif" font-size="38" fill="url(#stats-silver)" text-anchor="middle" >13.0</text><text x="458" y="104" class="sans" font-size="13" fill="#8D97BF" text-anchor="middle" >top game speed reached</text><rect x="604" y="24" width="276" height="102" rx="16" fill="#0D1630" stroke="#2B3D7C"/><text x="742" y="78" class="serif" font-size="38" fill="url(#stats-silver)" text-anchor="middle" >200/s</text><text x="742" y="104" class="sans" font-size="13" fill="#8D97BF" text-anchor="middle" >decisions per second</text><rect x="888" y="24" width="276" height="102" rx="16" fill="#0D1630" stroke="#2B3D7C"/><text x="1026" y="78" class="serif" font-size="38" fill="url(#stats-silver)" text-anchor="middle" >44</text><text x="1026" y="104" class="sans" font-size="13" fill="#8D97BF" text-anchor="middle" >lines of JavaScript</text>
</svg>
