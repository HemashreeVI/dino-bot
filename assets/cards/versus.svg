<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="vs-t vs-d">
<title id="vs-t">Rules vs brain</title>
<desc id="vs-d">Hand-written rules: Written by me, 44 lines, Training time none, Fair exam: survived 10 min 20/20 · avg 11,088, Knows why it jumps? yes, I wrote it; Evolved brain: Written by evolution, 91 weights, Training time 31 generations, Fair exam: survived 10 min 17/20 · avg 10,627, Knows why it jumps? honestly, no one does</desc>

<style>
