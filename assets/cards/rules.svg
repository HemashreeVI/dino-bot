ght="4"/><rect x="1018" y="44" width="8" height="4"/><rect x="1010" y="48" width="16" height="4"/><rect x="1002" y="52" width="36" height="4"/><rect x="1014" y="56" width="28" height="4"/><rect x="1018" y="60" width="24" height="4"/><rect x="1026" y="64" width="16" height="4"/></g></g><text x="914" y="172" class="serif" font-size="24" fill="#E8F1EC" text-anchor="start" >High bird</text><text x="914" y="196" class="sans" font-size="13" fill="#8EA99A" text-anchor="start" >flies over the dino</text><rect x="914" y="216" width="68" height="30" rx="15" fill="#7FE0A8" fill-opacity=".14" stroke="#7FE0A8"/><circle cx="930" cy="231" r="4" fill="#7FE0A8" class="pulse" style="animation-delay:1.7999999999999998s"/><text x="942" y="236" class="mono" font-size="13" fill="#7FE0A8" text-anchor="start" letter-spacing="2" font-weight="700">RUN</text>
</svg>
