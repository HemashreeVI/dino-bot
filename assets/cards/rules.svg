<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="rules-t rules-d">
<title id="rules-t">Jump, duck or run</title>
<desc id="rules-d">Cactus (any size): jump; Low bird (flies at ground level): jump; Mid bird (flies at head height): duck; High bird (flies over the dino): run</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="rules-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#12241B"/>
    <stop offset=".55" stop-color="#0C1712"/>
    <stop offset="1" stop-color="#07100C"/>
  </radialGradient>
  <radialGradient id="rules-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#2FBF71" stop-opacity=".38"/>
    <stop offset="1" stop-color="#2FBF71" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rules-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F5B461" stop-opacity=".10"/>
    <stop offset="1" stop-color="#F5B461" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rules-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C3D6CB"/>
    <stop offset="1" stop-color="#7FE0A8"/>
  </linearGradient>
  <linearGradient id="rules-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7FE0A8" stop-opacity="0"/>
    <stop offset=".25" stop-color="#7FE0A8" stop-opacity=".8"/>
    <stop offset="1" stop-color="#7FE0A8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="rules-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#7FE0A8" stroke-opacity=".05"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1198" height="288" rx="22" fill="url(#rules-bg)" stroke="#1C3529"/>
<rect x="1" y="1" width="1198" height="288" rx="22" fill="url(#rules-grid)"/>
<ellipse cx="360" cy="116" rx="420" ry="203" fill="url(#rules-glowA)"/>
