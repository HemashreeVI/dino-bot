<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-labelledby="t04-t t04-d">
<title id="t04-t">04 Try It: Run it yourself.</title>
<desc id="t04-d">NO INSTALL NEEDED</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="t04-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#13204A"/>
    <stop offset=".55" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#060914"/>
  </radialGradient>
  <radialGradient id="t04-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4169E1" stop-opacity=".38"/>
    <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="t04-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F5B461" stop-opacity=".10"/>
    <stop offset="1" stop-color="#F5B461" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="t04-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C4CCE8"/>
    <stop offset="1" stop-color="#8EA8FF"/>
  </linearGradient>
  <linearGradient id="t04-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8EA8FF" stop-opacity="0"/>
    <stop offset=".25" stop-color="#8EA8FF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8EA8FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="t04-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#8EA8FF" stroke-opacity=".05"/>
  </pattern>
</defs>

<text x="30" y="32" class="mono" font-size="12" fill="#EAEEFA" text-anchor="start" letter-spacing="3">04</text>
<text x="58" y="32" class="mono" font-size="12" fill="#8EA8FF" text-anchor="start" letter-spacing="3">TRY IT</text>
<text x="1170" y="32" class="mono" font-size="11" fill="#8D97BF" text-anchor="end" letter-spacing="3">NO INSTALL NEEDED</text>
<text x="30" y="80" class="serif" font-size="40" fill="#EAEEFA">Run it <tspan fill="#8EA8FF" font-style="italic">yourself.</tspan></text>
<rect x="30" y="96" width="1140" height="1.2" fill="url(#t04-rule)"/>
<circle cy="96.6" r="2.6" fill="#fff">
  <animate attributeName="cx" values="30;1170" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="6s" repeatCount="indefinite"/>
</circle>

</svg>
