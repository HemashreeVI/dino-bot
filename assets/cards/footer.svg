<text x="600" y="64" class="mono" font-size="12" fill="#7FE0A8" text-anchor="middle" letter-spacing="4">A WEEKEND PROJECT · BUILT FOR FUN AND LEARNING</text>
<text x="600" y="164" class="serif" font-size="88" font-style="italic" text-anchor="middle" fill="url(#foot-silver)" letter-spacing="2">Dino Bot</text>
