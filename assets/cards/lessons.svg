<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 466" width="1200" height="466" role="img" aria-labelledby="les-t les-d">
<title id="les-t">Problems I ran into, and what's next</title>
<desc id="les-d">The game speeds up (solved): a fixed jump distance fails later, so the bot reacts earlier as speed grows; Birds at three heights (solved): jumping into a mid-height bird ends the game, so heights are checked; Long jumps at top speed (solved): the dino landed on the next cactus; it now drops fast once clear; Different Chrome versions (solved): Runner.getInstance() in new Chrome, Runner.instance_ in old; Neural network (solved): trained by evolution in the real game; see section 06; Screen-only version (next): play using screenshots alone, without reading the game's code</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="les-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#13204A"/>
    <stop offset=".55" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#060914"/>
  </radialGradient>
  <radialGradient id="les-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4169E1" stop-opacity=".38"/>
    <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="les-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F5B461" stop-opacity=".10"/>
    <stop offset="1" stop-color="#F5B461" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="les-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C4CCE8"/>
    <stop offset="1" stop-color="#8EA8FF"/>
  </linearGradient>
  <linearGradient id="les-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8EA8FF" stop-opacity="0"/>
    <stop offset=".25" stop-color="#8EA8FF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8EA8FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="les-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#8EA8FF" stroke-opacity=".05"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1198" height="464" rx="22" fill="url(#les-bg)" stroke="#1B2754"/>
<rect x="1" y="1" width="1198" height="464" rx="22" fill="url(#les-grid)"/>
<ellipse cx="240" cy="186" rx="420" ry="326" fill="url(#les-glowA)"/>
