<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="loop-t loop-d">
<title id="loop-t">Read, decide, act</title>
<desc id="loop-d">READ: next obstacle · type, distance · height · speed → DECIDE: react at speed × 13, jump · duck · keep running → ACT: startJump() · setDuck(), drop fast after clearing</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="loop-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#13204A"/>
    <stop offset=".55" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#060914"/>
  </radialGradient>
  <radialGradient id="loop-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#4169E1" stop-opacity=".38"/>
    <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="loop-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F5B461" stop-opacity=".10"/>
    <stop offset="1" stop-color="#F5B461" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="loop-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C4CCE8"/>
    <stop offset="1" stop-color="#8EA8FF"/>
  </linearGradient>
  <linearGradient id="loop-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8EA8FF" stop-opacity="0"/>
    <stop offset=".25" stop-color="#8EA8FF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#8EA8FF" stop-opacity="0"/>
  </linearGradient>
  <pattern id="loop-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#8EA8FF" stroke-opacity=".05"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#loop-bg)" stroke="#1B2754"/>
<rect x="1" y="1" width="1198" height="328" rx="22" fill="url(#loop-grid)"/>
<ellipse cx="600" cy="165" rx="420" ry="231" fill="url(#loop-glowA)"/>
<ellipse cx="600" cy="165" rx="300" ry="165" fill="url(#loop-glowB)"/>
<rect x="70" y="60" width="300" height="180" rx="18" fill="#0D1630" stroke="#2B3D7C"/>
<circle cx="110" cy="100" r="16" fill="none" stroke="#8EA8FF"/>
<circle cx="110" cy="100" r="5" fill="#CFDAFF" class="pulse" style="animation-delay:0.0s"/>
<text x="138" y="98" class="mono" font-size="11" fill="#8D97BF" text-anchor="start" letter-spacing="2">01</text>
<text x="138" y="115" class="mono" font-size="10" fill="#8EA8FF" text-anchor="start" letter-spacing="2">THE GAME STATE</text>
<text x="94" y="168" class="serif" font-size="34" fill="#EAEEFA" text-anchor="start" letter-spacing="4">READ</text>
<text x="94" y="198" class="mono" font-size="13" fill="#C4CCE8" text-anchor="start" >next obstacle · type</text>
<text x="94" y="220" class="mono" font-size="13" fill="#8D97BF" text-anchor="start" >distance · height · speed</text><path d="M376 150H444" stroke="#8EA8FF" stroke-dasharray="3 5"/>
<path d="M436 144l8 6-8 6" fill="none" stroke="#8EA8FF"/>
<circle r="3.5" fill="#fff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M376 150H440" begin="0.0s"/></circle>
<rect x="450" y="60" width="300" height="180" rx="18" fill="#0D1630" stroke="#2B3D7C"/>
<circle cx="490" cy="100" r="16" fill="none" stroke="#8EA8FF"/>
<circle cx="490" cy="100" r="5" fill="#CFDAFF" class="pulse" style="animation-delay:0.8s"/>
<text x="518" y="98" class="mono" font-size="11" fill="#8D97BF" text-anchor="start" letter-spacing="2">02</text>
<text x="518" y="115" class="mono" font-size="10" fill="#8EA8FF" text-anchor="start" letter-spacing="2">WHAT TO DO</text>
<text x="474" y="168" class="serif" font-size="34" fill="#EAEEFA" text-anchor="start" letter-spacing="4">DECIDE</text>
<text x="474" y="198" class="mono" font-size="13" fill="#C4CCE8" text-anchor="start" >react at speed × 13</text>
<text x="474" y="220" class="mono" font-size="13" fill="#8D97BF" text-anchor="start" >jump · duck · keep running</text><path d="M756 150H824" stroke="#8EA8FF" stroke-dasharray="3 5"/>
<path d="M816 144l8 6-8 6" fill="none" stroke="#8EA8FF"/>
<circle r="3.5" fill="#fff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M756 150H820" begin="0.9s"/></circle>
<rect x="830" y="60" width="300" height="180" rx="18" fill="#0D1630" stroke="#2B3D7C"/>
<circle cx="870" cy="100" r="16" fill="none" stroke="#8EA8FF"/>
<circle cx="870" cy="100" r="5" fill="#CFDAFF" class="pulse" style="animation-delay:1.6s"/>
<text x="898" y="98" class="mono" font-size="11" fill="#8D97BF" text-anchor="start" letter-spacing="2">03</text>
<text x="898" y="115" class="mono" font-size="10" fill="#8EA8FF" text-anchor="start" letter-spacing="2">PRESS THE KEY</text>
<text x="854" y="168" class="serif" font-size="34" fill="#EAEEFA" text-anchor="start" letter-spacing="4">ACT</text>
<text x="854" y="198" class="mono" font-size="13" fill="#C4CCE8" text-anchor="start" >startJump() · setDuck()</text>
<text x="854" y="220" class="mono" font-size="13" fill="#8D97BF" text-anchor="start" >drop fast after clearing</text><path d="M980 240 V282 H220 V244" fill="none" stroke="#8EA8FF" stroke-opacity=".5" stroke-dasharray="3 6"/>
<path d="M214 252l6-8 6 8" fill="none" stroke="#8EA8FF" stroke-opacity=".7"/>
<circle r="3" fill="#CFDAFF"><animateMotion dur="5s" repeatCount="indefinite" path="M980 240 V282 H220 V244"/></circle>
<text x="600" y="300" class="mono" font-size="11" fill="#8EA8FF" text-anchor="middle" letter-spacing="4">EVERY 5 MILLISECONDS</text>
<text x="600" y="38" class="serif" font-size="14" fill="#8D97BF" text-anchor="middle" font-style="italic">No screenshots, no guessing: the bot asks the game where the next obstacle is.</text>
</svg>
